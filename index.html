<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blob War 3D</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💥</text></svg>" />
    <style>
      :root {
        --panel: rgba(12, 16, 24, 0.62);
        --panel-strong: rgba(10, 13, 20, 0.9);
        --edge: rgba(255, 255, 255, 0.14);
        --text: #eef3fb;
        --muted: #9fb0c6;
        --accent: #ffd166;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0f18;
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      canvas { display: block; }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        padding: 10px 14px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }

      /* ---- turn banner ---- */
      #banner {
        position: absolute;
        top: 14px; left: 50%;
        transform: translateX(-50%);
        text-align: center;
        min-width: 260px;
      }
      #turnTeam { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
      #turnBlob { font-size: 13px; color: var(--muted); margin-top: 2px; }
      #timer {
        font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
        line-height: 1; margin-top: 4px;
      }
      #timer.low { color: #ff6b6b; animation: pulse 0.7s infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }

      /* ---- wind ---- */
      #windBox {
        position: absolute; top: 14px; left: 14px;
        width: 168px; text-align: center;
      }
      .label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
      #windArrow { font-size: 26px; line-height: 1.1; transition: transform 0.4s ease; display: inline-block; }
      #windBar {
        height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; margin-top: 5px;
      }
      #windFill { height: 100%; width: 0%; background: linear-gradient(90deg, #6ee7ff, #3f9bff); transition: width 0.3s; }
      #windVal { font-size: 12px; color: var(--muted); margin-top: 3px; }

      /* ---- roster ---- */
      #roster { position: absolute; top: 14px; right: 14px; width: 210px; display: flex; flex-direction: column; gap: 10px; }
      .team { padding: 8px 12px; }
      .team h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: 2px; }
      .blobRow { display: flex; align-items: center; gap: 7px; margin: 4px 0; font-size: 12px; }
      .blobRow .nm { width: 62px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar { flex: 1; height: 8px; background: rgba(255,255,255,0.13); border-radius: 4px; overflow: hidden; }
      .bar i { display: block; height: 100%; background: #5ddb6a; transition: width 0.25s; }
      .blobRow.dead { opacity: 0.32; text-decoration: line-through; }
      .blobRow.active .nm { color: #fff; font-weight: 700; }
      .blobRow .hp { width: 26px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      /* Tier 1: your own current character. Tier 2: real-time's enemies-in-motion,
         or (turn-based) a preview of your own next character. */
      .blobRow.mine-current { box-shadow: inset 3px 0 0 #fff; background: rgba(255,255,255,0.06); }
      .blobRow.mine-current .nm { color: #fff; font-weight: 700; }
      .blobRow.next-up { box-shadow: inset 3px 0 0 #ffd166; }
      .blobRow.next-up .nm { color: #ffd166; }

      /* ---- minimap ---- */
      #minimap {
        position: absolute; top: 138px; left: 14px; width: 168px;
        padding: 7px 8px 8px; pointer-events: auto; cursor: pointer;
      }
      #minimap .label { margin-bottom: 5px; }
      #minimap .label b { color: var(--accent); }
      #minimap:hover { border-color: rgba(255,255,255,0.3); }
      #minimapCanvas { display: block; width: 152px; height: 152px; border-radius: 6px; }

      /* ---- full map ---- */
      #mapView {
        position: absolute; inset: 0; display: grid; place-items: center;
        pointer-events: auto; cursor: grab;
      }
      #mapView:active { cursor: grabbing; }
      #mapView.mode2d { background: radial-gradient(circle at 50% 45%, rgba(8,12,20,0.93), rgba(3,5,9,0.97)); }
      #mapView.mode3d { background: none; }
      #mapView.mode3d #mapCanvas { display: none; }
      #mapCanvas { border-radius: 12px; border: 1px solid var(--edge); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
      #mapBar {
        position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 14px; padding: 9px 12px;
        background: var(--panel-strong);
      }
      #mapHint { font-size: 11px; color: var(--muted); }
      #mapBar button { padding: 8px 14px; font-size: 12px; }
      #mapBar .seg button { padding: 7px 12px; }

      /* ---- current weapon chip ---- */
      #current {
        position: absolute; left: 14px; bottom: 14px; min-width: 240px;
        display: flex; align-items: center; gap: 11px; padding: 11px 14px;
      }
      #curIcon { font-size: 30px; line-height: 1; }
      #curBody { flex: 1; }
      #curName { font-size: 15px; font-weight: 700; }
      #curAmmo { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      #curHint { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-align: right; }

      /* ---- inventory ---- */
      #inventory {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(1080px, 95vw); max-height: 86vh; overflow-y: auto;
        padding: 18px 20px; pointer-events: auto;
        background: var(--panel-strong); border: 1px solid var(--edge); border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      }
      #inventory h2 {
        margin: 0 0 4px; font-size: 17px; letter-spacing: 3px; text-align: center;
      }
      #inventory .sub { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
      .invCat { margin-bottom: 12px; }
      .invCat h4 {
        margin: 0 0 7px; font-size: 10px; letter-spacing: 2px; color: var(--muted);
        text-transform: uppercase; border-bottom: 1px solid var(--edge); padding-bottom: 4px;
      }
      .invGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 7px; }
      .invItem {
        display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 10px;
        background: rgba(255,255,255,0.05); border: 1px solid var(--edge); cursor: pointer;
        transition: background 0.1s, border-color 0.1s;
      }
      .invItem:hover { background: rgba(255,255,255,0.11); }
      .invItem .ic { font-size: 21px; line-height: 1; width: 24px; text-align: center; }
      .invItem .tx { flex: 1; min-width: 0; }
      .invItem .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .invItem .ds { font-size: 10px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
      .invItem .am {
        font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
        min-width: 26px; text-align: right;
      }
      .invItem.sel { border-color: var(--accent); background: rgba(255, 209, 102, 0.16); }
      .invItem.out { opacity: 0.32; cursor: default; }
      .invItem.out:hover { background: rgba(255,255,255,0.05); }

      /* ---- power ---- */
      #powerBox { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: 340px; text-align: center; }
      #powerTrack { height: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--edge); border-radius: 9px; overflow: hidden; }
      #powerFill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #6ee7ff 0%, #7ed957 35%, #ffd166 68%, #ff5f4d 100%);
      }
      #powerHint { font-size: 11px; color: var(--muted); margin-top: 6px; }
      #angleRead { font-size: 11px; color: var(--muted); margin-bottom: 5px; font-variant-numeric: tabular-nums; }

      /* ---- log ---- */
      #log {
        position: absolute; right: 14px; bottom: 14px; width: 260px; font-size: 11.5px;
        color: var(--muted); display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
      }
      #log div { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 9px; }

      /* ---- reticle ---- */
      #reticle {
        position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
        background: rgba(255,255,255,0.5); border-radius: 50%;
      }

      /* ---- help ---- */
      #help {
        position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%);
        font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap;
      }
      kbd {
        background: rgba(255,255,255,0.14); border: 1px solid var(--edge); border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; font-family: inherit; font-size: 10px; color: #fff;
      }

      /* ---- overlays ---- */
      #overlay {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 40%, rgba(10,16,28,0.72), rgba(4,7,12,0.94));
        pointer-events: auto;
      }
      #overlay.hidden { display: none; }
      .card { max-width: 620px; text-align: center; padding: 34px 40px; }
      .card h1 {
        margin: 0 0 6px; font-size: 46px; letter-spacing: 3px;
        background: linear-gradient(90deg, #ef4a4a, #ffd166, #3f9bff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .card h2 { margin: 0 0 14px; font-size: 30px; letter-spacing: 2px; }
      .card p { margin: 6px 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .keys { display: grid; grid-template-columns: auto auto; gap: 6px 16px; margin: 18px auto; text-align: left; width: max-content; font-size: 13px; }
      .keys span:nth-child(odd) { color: var(--muted); }
      .modes { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
      button {
        font: inherit; font-weight: 700; letter-spacing: 1px; color: #0b1018;
        background: linear-gradient(180deg, #ffe8a8, #ffd166);
        border: none; border-radius: 10px; padding: 12px 22px; cursor: pointer;
        box-shadow: 0 4px 0 #b8913c, 0 8px 20px rgba(0,0,0,0.4);
        transition: transform 0.08s;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8913c; }
      button.alt { background: linear-gradient(180deg, #cfe0f5, #9db8d8); box-shadow: 0 4px 0 #667f9e, 0 8px 20px rgba(0,0,0,0.4); }

      /* While the map is up, the aiming HUD is just noise over it. */
      #ui.mapping #powerBox, #ui.mapping #help, #ui.mapping #reticle { display: none; }

      /* Before a match exists there's nothing for the HUD to describe. */
      #ui.preGame #banner, #ui.preGame #windBox, #ui.preGame #roster,
      #ui.preGame #current, #ui.preGame #powerBox, #ui.preGame #help,
      #ui.preGame #log, #ui.preGame #reticle, #ui.preGame #inventory,
      #ui.preGame #minimap, #ui.preGame #mapView { display: none; }

      /* ---- menu screens ---- */
      .card .fine { font-size: 12px; color: var(--muted); min-height: 16px; }
      .setup {
        display: grid; grid-template-columns: auto 1fr; gap: 10px 16px;
        align-items: center; margin: 18px auto; width: max-content; text-align: left;
      }
      .setup label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
      .setup input {
        font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; width: 190px;
        background: rgba(0,0,0,0.4); border: 1px solid var(--edge); color: var(--text);
      }
      .setup input:focus { outline: none; border-color: var(--accent); }
      .seg { display: flex; gap: 5px; }
      .seg button {
        font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0; padding: 7px 13px;
        border-radius: 8px; background: rgba(255,255,255,0.08); color: var(--text);
        border: 1px solid var(--edge); box-shadow: none; cursor: pointer;
      }
      .seg button:hover { background: rgba(255,255,255,0.16); transform: none; }
      .seg button.on { background: rgba(255,209,102,0.2); border-color: var(--accent); color: #fff; }

      .setup label { align-self: start; padding-top: 6px; }
      .mapGrid { display: flex; flex-wrap: wrap; gap: 8px; max-width: 460px; }
      .mapCard {
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        width: 84px; padding: 6px; border-radius: 10px; cursor: pointer;
        background: rgba(255,255,255,0.06); border: 1px solid var(--edge); box-shadow: none;
      }
      .mapCard:hover { background: rgba(255,255,255,0.14); transform: none; }
      .mapCard.on { background: rgba(255,209,102,0.18); border-color: var(--accent); }
      .mapCard img {
        width: 100%; aspect-ratio: 1; border-radius: 6px; display: block;
        object-fit: cover; border: 1px solid rgba(0,0,0,0.35);
      }
      .mapCard span { font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--text); }
      .mapCard.custom { cursor: default; }
      .mapCard.dashed { border-style: dashed; justify-content: center; cursor: pointer; }
      .mapCard .mapPlus {
        font-size: 26px; color: var(--muted); line-height: 1; width: 100%; aspect-ratio: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .mapCard .mapSelect { background: none; border: none; box-shadow: none; padding: 0; width: 100%; cursor: pointer; }
      .mapCard .mapSelect img {
        width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; display: block;
        border: 1px solid rgba(0,0,0,0.35);
      }
      .mapCard .mapEdit {
        font-size: 10px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.1);
        border: 1px solid var(--edge); box-shadow: none; color: var(--text); cursor: pointer;
      }
      .mapCard .mapEdit:hover { background: rgba(255,255,255,0.2); transform: none; }

      /* ---- map editor ---- */
      .card.wide { max-width: 900px; }
      .editorLayout { display: flex; gap: 20px; align-items: flex-start; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
      #paintCanvas { border-radius: 12px; border: 1px solid var(--edge); cursor: crosshair; touch-action: none; background: #14202c; }
      .editorPanel { display: flex; flex-direction: column; gap: 7px; width: 220px; text-align: left; }
      .editorPanel label {
        font-size: 11px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase;
        display: flex; justify-content: space-between; align-self: auto; padding-top: 0;
      }
      .editorPanel input[type="range"] { width: 100%; accent-color: var(--accent); }
      .editorPanel input:not([type="range"]) {
        font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 7px; width: 100%;
        background: rgba(0,0,0,0.4); border: 1px solid var(--edge); color: var(--text); box-sizing: border-box;
      }
      .editorPanel .seg { flex-wrap: wrap; }
      .editorPanel .seg button { padding: 6px 9px; }
      .editorPreviewImg {
        width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--edge);
        object-fit: cover; background: #14202c; display: block;
      }
      .wgrid { display: flex; flex-wrap: wrap; gap: 5px; max-width: 360px; }
      .wchip {
        font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0; padding: 6px 10px;
        border-radius: 8px; background: rgba(255,255,255,0.08); color: var(--text);
        border: 1px solid var(--edge); box-shadow: none; cursor: pointer;
      }
      .wchip:hover { background: rgba(255,255,255,0.16); transform: none; }
      .wchip.off { opacity: 0.32; text-decoration: line-through; }
      .wchip.locked { cursor: default; opacity: 0.75; border-style: dashed; }

      .slots { display: flex; flex-direction: column; gap: 7px; margin: 18px auto; width: min(340px, 100%); }
      .slot {
        display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 10px;
        background: rgba(255,255,255,0.06); border: 1px solid var(--edge); font-size: 13px;
      }
      .slot .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
      .slot .who { flex: 1; text-align: left; }
      .slot .who em { font-style: normal; color: var(--muted); font-size: 11px; }
      .slot .sq { font-size: 11px; letter-spacing: 1px; font-weight: 700; }
      .code { letter-spacing: 6px; font-size: 22px; color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button:disabled:hover { transform: none; }

      #banner.waiting { opacity: 0.75; border-color: rgba(255,255,255,0.28); }

      #toast {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        font-size: 34px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 4px 18px rgba(0,0,0,0.7);
        opacity: 0; transition: opacity 0.3s;
      }
      #toast.show { opacity: 1; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="reticle"></div>

      <div id="windBox" class="panel">
        <div class="label">Wind</div>
        <div id="windArrow">→</div>
        <div id="windBar"><div id="windFill"></div></div>
        <div id="windVal">calm</div>
      </div>

      <div id="banner" class="panel">
        <div id="turnTeam">CRIMSON</div>
        <div id="turnBlob">Squelch</div>
        <div id="timer">40</div>
      </div>

      <div id="minimap" class="panel" title="Open the full map (M)">
        <div class="label">Map <b>M</b></div>
        <canvas id="minimapCanvas"></canvas>
      </div>

      <div id="roster"></div>

      <div id="current" class="panel">
        <div id="curIcon">🚀</div>
        <div id="curBody">
          <div id="curName">Bazooka</div>
          <div id="curAmmo">∞</div>
        </div>
        <div id="curHint">TAB<br />ARMORY</div>
      </div>

      <div id="inventory" class="hidden"></div>

      <div id="powerBox">
        <div id="angleRead">angle 0° · power 0%</div>
        <div id="powerTrack"><div id="powerFill"></div></div>
        <div id="powerHint">Hold <kbd>click</kbd> to charge, release to fire</div>
      </div>

      <div id="help">
        <kbd>WASD</kbd> move · <kbd>J</kbd> jump · <kbd>right-drag</kbd> aim · <kbd>click</kbd> fire ·
        <kbd>ctrl</kbd>+<kbd>right-drag</kbd> look · <kbd>wheel</kbd> zoom · <kbd>Tab</kbd> armory ·
        <kbd>Q</kbd><kbd>E</kbd> cycle weapon · <kbd>M</kbd> map · <kbd>N</kbd> skip · <kbd>K</kbd> mute
      </div>

      <div id="log"></div>
      <div id="toast"></div>

      <!-- Full-screen map. In 3D mode the canvas is hidden and the scene itself
           is rendered from an orbiting camera behind this overlay. -->
      <div id="mapView" class="hidden mode2d">
        <canvas id="mapCanvas"></canvas>
        <div id="mapBar" class="panel">
          <div class="seg" id="mapModes">
            <button data-v="2d" class="on">TOP-DOWN</button>
            <button data-v="3d">3D ORBIT</button>
          </div>
          <span id="mapHint"></span>
          <button id="mapClose" class="alt">CLOSE</button>
        </div>
      </div>

      <!-- Every menu screen is rendered into here by src/menu.js -->
      <div id="overlay"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
